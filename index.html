<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>🔗 GrowBot Pairing</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #000;
      color: #0f0;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .container {
      max-width: 600px;
      margin: 40px auto;
      padding: 30px;
      background: #111;
      border: 1px solid #0f0;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 255, 0, 0.1);
    }
    h1 { color: #0f0; margin: 0 0 20px; }
    .status { margin: 20px 0; line-height: 1.6; }
    .code { 
      font-family: 'Courier New', monospace;
      font-size: 22px;
      letter-spacing: 3px;
      background: #222;
      padding: 15px;
      border-radius: 8px;
      margin: 20px auto;
      color: #0f0;
      text-shadow: 0 0 5px #0f0;
    }
    .refresh, .cancel {
      background: #0f0;
      color: #000;
      border: none;
      padding: 10px 20px;
      margin: 10px;
      cursor: pointer;
      font-weight: bold;
      border-radius: 6px;
      font-size: 14px;
    }
    .refresh:hover { background: #00ff44; }
    .cancel { background: #333; color: #fff; }
    .cancel:hover { background: #555; }
    .qr-canvas { display: none; }
    .footer { margin-top: 40px; font-size: 12px; color: #555; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔐 GrowBot Pairing</h1>
    <p>Scan the QR code or enter the code manually in WhatsApp → Linked Devices.</p>

    <div id="qr" class="qr-canvas"></div>
    <div id="code" class="code">Loading pairing code...</div>

    <div class="status" id="status">Initializing...</div>

    <div>
      <button class="refresh" onclick="fetchPairing()">Refresh</button>
      <button class="cancel" onclick="cancelPairing()">Cancel</button>
    </div>
  </div>

  <div class="footer">
    GrowBot • Silent. Efficient. Unstoppable.
  </div>

  <script>
    const pairingId = new URLSearchParams(window.location.search).get('id') || null;
    let pollTimer;

    window.onload = () => {
      if (pairingId) resumePairing(pairingId);
      else startNewPairing();
    };

    async function startNewPairing() {
      const res = await fetch(`/api/pair?number=${encodeURIComponent(prompt('Enter WhatsApp number with country code:') || ''))`);
      const data = await res.json();
      if (data.ok) {
        const newUrl = `?id=${encodeURIComponent(data.pairingId)}`;
        window.history.replaceState(null, '', newUrl);
        trackPairing(data.pairingId);
      } else {
        alert(`Error: ${data.error}`);
      }
    }

    function resumePairing(id) {
      document.getElementById('status').innerText = 'Resuming session...';
      trackPairing(id);
    }

    function trackPairing(id) {
      fetchPairingStatus(id);
      pollTimer = setInterval(() => fetchPairingStatus(id), 3000);
    }

    async function fetchPairingStatus(id) {
      const res = await fetch(`/api/pair/status?id=${encodeURIComponent(id)}`);
      const data = await res.json();
      if (!data.ok) {
        document.getElementById('status').innerText = `❌ ${data.error}`;
        clearInterval(pollTimer);
        return;
      }

      const codeEl = document.getElementById('code');
      const statusEl = document.getElementById('status');

      if (data.code) {
        codeEl.innerText = data.code.match(/.{1,3}/g).join(' ');
      } else {
        codeEl.innerText = 'Waiting for code...';
      }

      statusEl.innerHTML = `<strong>Status:</strong> ${data.status.replace(/_/g, ' ')}`;

      if (data.status === 'open') {
        clearInterval(pollTimer);
        statusEl.innerHTML = '<span style="color:#0f0">✅ Device paired successfully!</span>';
        codeEl.style.display = 'none';
        document.querySelector('.refresh').disabled = true;
      } else if (data.status === 'failed' || data.status === 'cancelled' || data.status === 'expired') {
        clearInterval(pollTimer);
        statusEl.innerHTML = `<span style="color:#f00">❌ ${data.status}: ${data.error || 'Session ended.'}</span>`;
      }
    }

    async function fetchPairing() {
      clearInterval(pollTimer);
      const res = await fetch(`/api/pair${pairingId ? '?id=' + encodeURIComponent(pairingId) : ''}`);
      const data = await res.json();
      if (data.ok && data.pairingId && !pairingId) {
        const newUrl = `?id=${encodeURIComponent(data.pairingId)}`;
        window.history.replaceState(null, '', newUrl);
        pairingId = data.pairingId;
      }
      trackPairing(pairingId);
    }

    async function cancelPairing() {
      if (!pairingId) return;
      await fetch(`/api/pair/cancel?id=${encodeURIComponent(pairingId)}`);
      document.getElementById('status').innerText = '❌ Pairing cancelled.';
      clearInterval(pollTimer);
    }
  </script>
</body>
</html>
